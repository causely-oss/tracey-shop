apiVersion: v2
name: tracey-shop
description: |
  A realistic e-commerce demo application for showcasing Causely's root-cause
  analysis. Five layers of services communicating over HTTP, gRPC, Postgres,
  Valkey and Kafka, fully instrumented with OpenTelemetry traces, with a
  configurable load generator and runtime fault injection.
