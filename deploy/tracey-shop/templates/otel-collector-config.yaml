{{- if .Values.otelCollector.enabled }}
{{- $c := .Values.otelCollector -}}
{{- $exporterName := ternary "otlphttp/causely" "otlp/causely" (eq $c.exporter.protocol "http") -}}
{{- $traceExporters := list $exporterName "debug" -}}
{{- range $name, $_ := $c.extraExporters }}
{{- $traceExporters = append $traceExporters $name }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracey-shop.collectorName" . }}
  labels:
    {{- include "tracey-shop.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ int $c.ports.grpc }}
          http:
            endpoint: 0.0.0.0:{{ int $c.ports.http }}

    processors:
      # REQUIRED for Causely. It stamps k8s.pod.uid, k8s.pod.name and
      # k8s.namespace.name onto each resource, which is how the mediator maps a
      # span to a Kubernetes workload and therefore to a Service entity. Remove
      # this and the entire demo becomes invisible in the topology.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.container.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
            - container.id
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
          - sources:
              - from: connection

      {{- if $c.filterInternalSpans }}
      # Causely analyses SERVER, CLIENT, PRODUCER and CONSUMER spans only, so
      # INTERNAL spans are pure ingest cost.
      filter/drop-internal:
        error_mode: ignore
        traces:
          span:
            - 'kind.string == "Internal"'
      {{- end }}

      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      batch:
        timeout: 1s
        send_batch_size: 8192
        send_batch_max_size: 12288

    exporters:
      {{- if eq $c.exporter.protocol "http" }}
      otlphttp/causely:
        endpoint: {{ if hasPrefix "http" $c.exporter.endpoint }}{{ $c.exporter.endpoint }}{{ else }}http://{{ $c.exporter.endpoint }}{{ end }}
        tls:
          insecure: {{ $c.exporter.insecure }}
      {{- else }}
      otlp/causely:
        endpoint: {{ $c.exporter.endpoint }}
        compression: none
        tls:
          insecure: {{ $c.exporter.insecure }}
      {{- end }}
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_elapsed_time: 60s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

      debug:
        verbosity: {{ $c.debugVerbosity }}

      {{- with $c.extraExporters }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, {{ if $c.filterInternalSpans }}filter/drop-internal, {{ end }}batch]
          exporters: [{{ join ", " $traceExporters }}]
        {{- if $c.metricsPipeline }}
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [{{ $exporterName }}]
        {{- end }}
{{- end }}
