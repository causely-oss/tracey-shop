name: Release image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  # write, not read: the tag path publishes a GitHub Release.
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately no docker/setup-qemu-action. The Dockerfile builds
      # FROM --platform=$BUILDPLATFORM and cross-compiles with GOARCH=$TARGETARCH,
      # so both architectures build natively on the amd64 runner. QEMU would only
      # make this slower.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Resolves to ghcr.io/causely-oss/tracey-shop — byte-identical to the
          # chart's default image.repository.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Skips the extra unknown/unknown attestation manifest, which confuses
          # `kind load docker-image` and some older registries.
          provenance: false

      # Only tags get a Release; pushes to main just move the `main` image tag.
      # Re-running the workflow must not fail, so this is a no-op if the Release
      # already exists.
      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi

          # Generate the PR-based changelog first, so the pull command can be
          # prepended to it rather than replacing it.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq '.body' > /tmp/generated.md

          version="${GITHUB_REF_NAME#v}"
          {
            echo "\`\`\`bash"
            echo "helm upgrade --install tracey-shop deploy/tracey-shop \\"
            echo "  -n tracey-shop --create-namespace \\"
            echo "  --set otelCollector.exporter.endpoint=mediator.causely:4317"
            echo "\`\`\`"
            echo
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY}:${version}\` (linux/amd64, linux/arm64)"
            echo
            cat /tmp/generated.md
          } > /tmp/notes.md

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
